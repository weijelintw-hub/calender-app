name: Build Calendar Diary iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Unzip & Locate Project Directory
        run: |
          # 尋找原始碼 zip 檔並解壓
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d ./extracted_project
          fi

          # 精確定位 package.json 所在的專案根目錄
          TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $TARGET_DIR"

      - name: Install Dependencies & Build Frontend
        run: |
          cd "${{ env.PROJECT_DIR }}"
          pnpm install --shamefully-hoist --no-frozen-lockfile
          pnpm run build || true
          npx cap add ios || true
          npx cap copy ios || true
          npx cap sync ios || true

      - name: Inject Permissions & Build IPA for Real Device
        run: |
          cd "${{ env.PROJECT_DIR }}"
          PLIST_PATH="ios/App/App/Info.plist"

          # 1. 自動注入 Face ID 與 行事曆 (NSCalendarsUsageDescription) 存取權限，防止原生黑屏崩潰
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'App requires Face ID access for security authentication.'" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSCalendarsUsageDescription string 'App requires access to calendar for syncing events.'" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSCalendarsFullAccessUsageDescription string 'App requires full access to calendar to write and update events.'" "$PLIST_PATH" 2>/dev/null || true
          fi

          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)

          # 2. 強制指定 -sdk iphoneos 針對實體 iPhone CPU 架構編譯
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 3. 打包生成 IPA 檔案
          mkdir -p build/Payload
          APP_PATH=$(find ios/App/Build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-app-ipa
          path: ${{ env.PROJECT_DIR }}/build/app.ipa
