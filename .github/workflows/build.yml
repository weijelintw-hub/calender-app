name: Build Calendar Diary iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unzip & Locate Project
        run: |
          unzip -o calendar-diary-source-1.0.0.zip -d ./source_project
          TARGET_DIR=$(dirname $(find ./source_project -name "package.json" | head -n 1))
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Install Dependencies & Build Web Assets
        run: |
          cd "${{ env.PROJECT_DIR }}"
          npm install --legacy-peer-deps
          npm run build --if-present

      - name: Setup Capacitor iOS Project
        run: |
          cd "${{ env.PROJECT_DIR }}"
          npx cap add ios || true
          npx cap copy ios || true
          npx cap sync ios || true

      - name: Build Unsigned IPA
        run: |
          cd "${{ env.PROJECT_DIR }}"
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          
          # 使用 Simulator/Generic iOS 參數無視簽名與架構限制
          xcodebuild -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive -archivePath ./build/App.xcarchive

          mkdir -p ./build/Payload
          cp -r ./build/App.xcarchive/Products/Applications/*.app ./build/Payload/
          cd ./build && zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-app-ipa
          path: ${{ env.PROJECT_DIR }}/build/app.ipa
