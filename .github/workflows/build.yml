name: Build Calendar Diary iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip & Locate Project
        run: |
          unzip -o calendar-diary-source-1.0.0.zip -d ./source_project
          TARGET_DIR=$(dirname $(find ./source_project -name "package.json" | head -n 1))
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Build Web & Capacitor iOS
        run: |
          cd "${{ env.PROJECT_DIR }}"
          npm install --legacy-peer-deps
          npm run build --if-present
          npx cap add ios || true
          npx cap copy ios || true
          npx cap sync ios || true

      - name: Compile unsigned App Bundle
        run: |
          cd "${{ env.PROJECT_DIR }}"
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)

          # 採用模擬器/通用架構編譯，完全繞過 Apple 憑證檢測
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 建立 Sideloadly 所需的 Payload IPA 結構
          mkdir -p build/Payload
          APP_PATH=$(find ios/App/Build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-app-ipa
          path: ${{ env.PROJECT_DIR }}/build/app.ipa
