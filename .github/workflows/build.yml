name: Build Calendar Diary iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Unzip & Locate Project
        run: |
          unzip -o calendar-diary-source-1.0.0.zip -d ./source_project
          TARGET_DIR=$(dirname $(find ./source_project -name "package.json" | head -n 1))
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Install Dependencies & Setup iOS
        run: |
          cd "${{ env.PROJECT_DIR }}"
          pnpm install --shamefully-hoist --no-frozen-lockfile
          pnpm run build || true
          npx cap add ios || true
          npx cap copy ios || true
          npx cap sync ios || true

      - name: Inject Info.plist Permissions & Build for Real Device (iphoneos)
        run: |
          cd "${{ env.PROJECT_DIR }}"
          PLIST_PATH="ios/App/App/Info.plist"

          # 自動補上 Face ID 存取權限說明，防止權限崩潰
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'App requires Face ID access for security authentication.'" "$PLIST_PATH" 2>/dev/null || true
          fi

          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)

          # 使用 iphoneos SDK 編譯真機可執行的二進位檔
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          APP_PATH=$(find ios/App/Build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-app-ipa
          path: ${{ env.PROJECT_DIR }}/build/app.ipa
